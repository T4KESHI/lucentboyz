
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUCENT BOYZ AR.js Test</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: sans-serif;
    }

    #status {
      position: fixed;
      z-index: 1000;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 12px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="status">AR.jsを読み込んでいます…</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="alpha: true; antialias: true; precision: mediump"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <img id="eunho" src="./images/EUNHO.png">
    </a-assets>



<!--
    <a-marker
      type="pattern"
      url="./markers/pattern-LB.patt"
      id="lb-marker">
-->

    <a-marker
      preset="hiro"
      id="hiro-marker">

      <a-image
        src="#eunho"
        width="0.05"
        height="0.1"
        position="0 0.05 0"
        rotation="-90 0 0">
      </a-image>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById("status");
    const marker = document.getElementById("hiro-marker");

    document.querySelector("a-scene").addEventListener("loaded", () => {
      status.textContent = "AR.js読み込み完了。カメラを準備しています…";
    });

    marker.addEventListener("markerFound", () => {
      status.textContent = "マーカー認識成功：EUNHO表示中";
    });

    marker.addEventListener("markerLost", () => {
      status.textContent = "マーカーを探しています";
    });

    window.addEventListener("error", (event) => {
      status.textContent = "エラー：" + event.message;
    });
  </script>
</body>
</html>
