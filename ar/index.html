
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LUCENT BOYZ | AR PHOTO</title>

  <!-- MindAR 公式ライブラリ -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #header {
      position: fixed;
      z-index: 10;
      top: env(safe-area-inset-top, 0);
      left: 0;
      width: 100%;
      padding: 14px 16px;
      color: white;
      background: rgba(0, 0, 0, 0.55);
      text-align: center;
      pointer-events: none;
    }

    #header strong {
      display: block;
      letter-spacing: 0.16em;
      font-size: 16px;
    }

    #status {
      margin-top: 6px;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    #hint {
      position: fixed;
      z-index: 10;
      left: 16px;
      right: 16px;
      bottom: calc(20px + env(safe-area-inset-bottom, 0));
      padding: 12px 14px;
      border-radius: 12px;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
      pointer-events: none;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <header id="header">
    <strong>LUCENT BOYZ</strong>
    <div id="status">AR PHOTO — カメラを準備しています</div>
  </header>

  <div id="hint">
    印刷したサンプル画像を机に置き、画面に映してください。
  </div>

  <a-scene
  mindar-image="
    imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;
    autoStart: true;
    uiLoading: yes;
    uiScanning: yes;
  "
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  loading-screen="enabled: false">
    
    <a-assets>
      <img
        id="eunho"
        src="./images/EUNHO.png"
        crossorigin="anonymous">
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- サンプルマーカーを認識した位置にEUNHOを表示 -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-image
        id="eunho-plane"
        src="#eunho"
        width="0.65"
        height="1.3"
        rotation="90 0 0"
        position="0 0 0.65">
      </a-image>
    </a-entity>
  </a-scene>

  <script>
    const statusText = document.getElementById("status");
    const hint = document.getElementById("hint");
    const eunhoImage = document.getElementById("eunho");
    const eunhoPlane = document.getElementById("eunho-plane");

    // PNG本来の縦横比を保つ
    function fitEunhoImage() {
      if (!eunhoImage.naturalWidth || !eunhoImage.naturalHeight) {
        return;
      }

      const height = 1.3;
      const width =
        height * eunhoImage.naturalWidth / eunhoImage.naturalHeight;

      eunhoPlane.setAttribute("width", width);
      eunhoPlane.setAttribute("height", height);
      eunhoPlane.setAttribute("position", `0 0 ${height / 2}`);
    }

    eunhoImage.addEventListener("load", fitEunhoImage);

    if (eunhoImage.complete) {
      fitEunhoImage();
    }

    // マーカーを認識したとき・見失ったときの案内
    const target = document.querySelector("[mindar-image-target]");

    target.addEventListener("targetFound", () => {
      statusText.textContent = "EUNHO を表示中";
      hint.textContent =
        "マーカーを映したまま、スマホの位置を調整してください。";
    });

    target.addEventListener("targetLost", () => {
      statusText.textContent = "マーカーを探しています";
      hint.textContent =
        "サンプル画像全体が画面に入るように映してください。";
    });

    document.querySelector("a-scene").addEventListener("loaded", () => {
      statusText.textContent = "マーカーを探しています";
    });
  </script>
</body>
</html>
